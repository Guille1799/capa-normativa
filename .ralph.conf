# .ralph.conf — config de Ralph para capa-normativa (la lee scripts/ralph.sh).
#
# ⚠️ Este fichero ESTA VERSIONADO, asi que el `git reset --hard` del propio loop lo restaura a lo
# que diga la rama. Lo especifico de una maquina o de un worktree va en `.ralph.local.conf`, que
# git ignora y por tanto el reset no puede tocar. ralph.sh lee ese DESPUES de este.

LEDGER="PENDIENTES.md"
LOG="PROGRESS.md"

# Este repo no tiene venv: el python del sistema trae pytest y pyyaml, y el gate son 7 segundos
# sin datos, sin red y sin indice. Es el gate mas barato de los cinco proyectos.
PY="python"
GATE_CMD="$PY -m pytest -q"

SECTION="🟢 PENDIENTE — SEGURO"
ITER_TIMEOUT=1800
MAX_STUCK=3
