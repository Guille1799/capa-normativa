# .ralph.conf — config de Ralph para capa-normativa (la lee scripts/ralph.sh).
#
# ⚠️ Este fichero ESTA VERSIONADO, asi que el `git reset --hard` del propio loop lo restaura a lo
# que diga la rama. Lo especifico de una maquina o de un worktree va en `.ralph.local.conf`, que
# git ignora y por tanto el reset no puede tocar. ralph.sh lee ese DESPUES de este.

LEDGER="PENDIENTES.md"
LOG="PROGRESS.md"

# Este repo no tiene venv: el python del sistema trae pytest y pyyaml, y el gate son 7 segundos
# sin datos, sin red y sin indice. Es el gate mas barato de los cinco proyectos.
PY="python"
GATE_CMD="$PY -m pytest -q"

SECTION="🟢 PENDIENTE — SEGURO"
ITER_TIMEOUT=1800
MAX_STUCK=3

# ---- Paso 1 del Mikado UN-SOLO-RALPH-SH (docs/decisiones/UN_SOLO_RALPH_SH_2026-09-06.md) ----
# Valores que HOY tiene esta copia de scripts/ralph.sh. Todavia NO las lee (grep: 0
# referencias) -> declararlas aqui es inocuo, las leera el paso 3. Medido 2026-09-12.

# MODELO: esta copia NO pasa --model a `claude -p` (scripts/ralph.sh:188-191) -> usa el
# default de la CLI `claude`. Vacio a proposito, no un valor inventado.
MODELO=""

# SCRIPTS_DIR: cableado como literal "scripts/" en cada llamada a los comprobadores
# (scripts/ralph.sh:213, 215, 219: `$PY scripts/aceptacion...`), no como variable.
SCRIPTS_DIR="scripts"

# LEDGER_VERSIONADO: este repo es PUBLICO y $LEDGER/$LOG estan en .gitignore a proposito
# (.gitignore:26-27; scripts/ralph.sh:134 "sin versionar" y :176 "ya NO estan versionados").
# Confirmado con `git ls-files .ralph.conf`: PENDIENTES.md NO aparece -> no esta trackeado.
LEDGER_VERSIONADO=0

# MAX_FILES_PER_TASK: mecanismo ausente en esta copia (grep de "MAX_FILES_PER_TASK"/"blast"/
# "nfiles" sobre scripts/ralph.sh: 0 resultados). Vacio = sin tope hoy, no un valor medido.
MAX_FILES_PER_TASK=""

# MAX_COMMITS_PER_RUN: mismo caso, ausente (0 resultados de grep). El unico tope de esta
# copia es MAX (iteraciones totales, scripts/ralph.sh:19), que es un mecanismo distinto.
MAX_COMMITS_PER_RUN=""
