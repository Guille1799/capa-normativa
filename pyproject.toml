[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "capa-normativa"
version = "0.10.1"
description = "Registro normativo: conocimiento externo que gobierna código, como datos verificables"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Guillermo Martín de Oliva" }]
keywords = ["knowledge", "provenance", "evidence", "decision-support", "governance"]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

# Primera superficie de línea de comandos del paquete (hasta hoy `entry_points` estaba vacío,
# y eso era el muro de adopción: la única interfaz era `load()`+`resolve()` en proceso Python).
# UNA entrada, no un dispatcher: cuando exista un segundo subcomando (`validate`, `emit`) se
# decide el despacho. Construir el dispatcher para un solo comando sería la sobre-ingeniería
# que este proyecto declara como su riesgo principal.
[project.scripts]
capa-normativa-vigilante = "capa_normativa.vigilante.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/capa_normativa"]

# PEP 561: sin este marcador en el WHEEL, las anotaciones del paquete se ignoran en
# silencio en los proyectos que lo usan. `packages` no lo incluye por si solo.
force-include = { "src/capa_normativa/py.typed" = "capa_normativa/py.typed" }
